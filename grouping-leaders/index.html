<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 課堂分組產生器 (正副組長版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            box-sizing: border-box;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            margin: 0;
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: confetti-fall 3s linear forwards;
            z-index: 50;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .pulse-button { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="min-h-full flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-5xl w-full">
            
            <div id="setup-stage" class="text-center">
                <h1 class="text-4xl font-bold text-gray-800 mb-6 bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                    🎲 課堂分組產生器
                </h1>

                <div class="grid md:grid-cols-2 gap-6 mb-6">
                    <div class="flex flex-col items-center bg-gray-50 p-4 rounded-2xl border border-gray-100">
                        <label class="block text-lg font-semibold text-gray-700 mb-2">🏷️ 班級 / 活動名稱 (選填)</label>
                        <input type="text" id="class-name" placeholder="例如：七年二班" 
                               class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none text-center shadow-sm transition-colors">
                    </div>
                    <div class="flex flex-col items-center bg-green-50 p-4 rounded-2xl border border-green-100">
                        <label class="block text-lg font-semibold text-gray-700 mb-2">👥 總共要分幾組？</label>
                        <input type="number" id="group-count" value="5" min="1" max="50" 
                               class="w-32 px-4 py-2 border-2 border-green-300 rounded-xl focus:border-green-500 focus:outline-none text-center font-bold text-xl shadow-sm">
                    </div>
                </div>
                
                <div class="bg-gray-50 p-6 rounded-2xl mb-6 border border-gray-200">
                    <h3 class="text-xl font-bold text-gray-700 mb-4">📋 學生名單來源 <span class="text-sm font-normal text-gray-500">(請擇一使用)</span></h3>
                    
                    <div class="grid md:grid-cols-3 gap-4 text-left">
                        <div class="bg-white border-2 border-purple-100 p-4 rounded-xl shadow-sm hover:border-purple-300 transition flex flex-col justify-center">
                            <label class="block text-md font-semibold text-purple-700 mb-2 text-center">🔢 方式一：座號範圍</label>
                            <div class="flex items-center space-x-2 justify-center mt-2 mb-4">
                                <label class="text-sm text-gray-600">從</label>
                                <input type="number" id="start-number" value="1" min="1" max="999" 
                                       class="w-16 px-2 py-1 border-2 border-purple-200 rounded-lg focus:border-purple-500 focus:outline-none text-center">
                                <div class="text-gray-500">到</div>
                                <input type="number" id="end-number" value="30" min="1" max="999" 
                                       class="w-16 px-2 py-1 border-2 border-purple-200 rounded-lg focus:border-purple-500 focus:outline-none text-center">
                            </div>
                            <p class="text-[11px] text-gray-400 mt-2 text-center">若最右側文字框有內容，將優先使用文字框</p>
                        </div>

                        <div class="bg-white border-2 border-blue-100 p-4 rounded-xl shadow-sm hover:border-blue-300 transition flex flex-col items-center justify-center">
                            <label class="block text-md font-semibold text-blue-700 mb-2 text-center">📁 方式二：上傳 Excel</label>
                            <p class="text-xs text-gray-500 mb-3 text-center">自動抓取第一行的資料</p>
                            <label class="cursor-pointer bg-blue-100 hover:bg-blue-200 text-blue-700 py-2 px-4 rounded-lg font-semibold transition-colors flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                選擇檔案
                                <input type="file" id="file-upload" accept=".xlsx, .xls, .csv">
                            </label>
                        </div>
                        
                        <div class="bg-white border-2 border-orange-100 p-4 rounded-xl shadow-sm hover:border-orange-300 transition">
                            <label class="block text-md font-semibold text-orange-700 mb-2">✍️ 方式三：貼上名單</label>
                            <textarea id="custom-numbers" placeholder="可直接從 Excel 貼上&#10;支援換行或逗號分隔&#10;上傳檔案後也會顯示於此" 
                                      class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:border-orange-500 focus:outline-none resize-none h-24 text-sm"></textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 p-6 rounded-2xl mb-8 border border-gray-200">
                    <button id="toggle-advanced-btn" class="w-full flex justify-between items-center text-left focus:outline-none group">
                        <h3 class="text-xl font-bold text-gray-700 group-hover:text-purple-600 transition-colors">
                            ⚙️ 全域進階設定 <span class="text-sm font-normal text-gray-500">(點擊展開 / 收合)</span>
                        </h3>
                        <svg id="advanced-chevron" class="w-6 h-6 text-gray-500 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="advanced-settings-content" class="hidden mt-6">
                        <div class="grid md:grid-cols-2 gap-4 text-left">
                            <div class="bg-white border-2 border-red-100 p-4 rounded-xl shadow-sm hover:border-red-300 transition">
                                <label class="block text-md font-semibold text-red-600 mb-2">❌ 扣除缺號 / 請假</label>
                                <p class="text-xs text-gray-400 mb-2">這些人不會被分組</p>
                                <textarea id="exclude-numbers" placeholder="例如: 4, 14 (支援空格、逗號或換行)" 
                                          class="w-full px-3 py-2 border border-red-200 rounded-lg focus:border-red-500 focus:outline-none resize-none h-20 text-sm"></textarea>
                            </div>

                            <div class="bg-white border-2 border-gray-200 p-4 rounded-xl shadow-sm hover:border-gray-300 transition">
                                <label class="block text-md font-semibold text-gray-600 mb-2">🤝 擴大社交圈</label>
                                <p class="text-xs text-gray-400 mb-2">不能在同一組的名單，<span class="text-gray-500 font-bold">每行一組</span></p>
                                <textarea id="blacklist" placeholder="例如：&#10;1, 2 (代表1號和2號不同組)&#10;王小明, 陳小華" 
                                          class="w-full px-3 py-2 border border-gray-200 bg-gray-50 text-gray-700 placeholder-gray-400 rounded-lg focus:border-gray-400 focus:outline-none resize-none h-20 text-sm"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button id="start-btn" class="bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-xl transform transition-all duration-200 hover:scale-105 pulse-button">
                    🚀 開始隨機分組
                </button>
            </div>

            <div id="game-stage" class="hidden">
                <div class="text-center mb-8">
                    <h2 id="result-title" class="text-4xl font-bold text-gray-800 mb-6">🎉 分組完成！</h2>
                </div>
                <div id="main-group-list" class="space-y-4 mb-8"></div>
                
                <div id="action-buttons" class="hidden flex flex-col sm:flex-row justify-center items-center gap-3 mt-8 flex-wrap">
                    <button id="download-excel-btn" class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-5 rounded-2xl text-base shadow-lg transform transition-all duration-200 hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        下載 Excel
                    </button>
                    <button id="copy-clipboard-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-3 px-5 rounded-2xl text-base shadow-lg transform transition-all duration-200 hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        複製內容
                    </button>
                    <a href="https://sheet.new" target="_blank" class="bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white font-bold py-3 px-5 rounded-2xl text-base shadow-lg transform transition-all duration-200 hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                        建立雲端試算表
                    </a>
                    <div class="w-px h-8 bg-gray-300 hidden sm:block mx-1"></div>
                    <button id="restart-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 px-5 rounded-2xl text-base shadow transition-all duration-200 hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        重來
                    </button>
                </div>
                
                <p id="cloud-tip" class="text-center text-sm text-gray-500 mt-4 hidden fade-in">
                    💡 雲端小撇步：先點「複製內容」，再點「建立雲端試算表」，在新分頁按下 Ctrl+V 貼上即可！
                </p>
            </div>
        </div>
    </div>

    <script>
        class RandomGroupGenerator {
            constructor() {
                this.audioContext = null;
                this.finalGroups = []; 
                this.bindEvents();
            }

            initializeAudio() {
                if (!this.audioContext) {
                    try { this.audioContext = new (window.AudioContext || window.webkitAudioContext)(); } 
                    catch (e) { console.log('Web Audio API not supported'); }
                }
                if (this.audioContext && this.audioContext.state === 'suspended') this.audioContext.resume();
            }

            playFlipSound() {
                if (!this.audioContext) return;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, this.audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.3);
            }

            playGroupSound(groupIndex) {
                if (!this.audioContext) return;
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                const baseFreq = 800 + (groupIndex * 150);
                oscillator.frequency.setValueAtTime(baseFreq, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq + 300, this.audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.2);
            }

            createConfetti() {
                const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3'];
                for (let i = 0; i < 60; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.transform = `translateX(${(Math.random() - 0.5) * 200}px)`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3500);
                }
            }

            bindEvents() {
                document.getElementById('toggle-advanced-btn').addEventListener('click', () => {
                    const content = document.getElementById('advanced-settings-content');
                    const chevron = document.getElementById('advanced-chevron');
                    content.classList.toggle('hidden');
                    chevron.classList.toggle('rotate-180');
                });

                document.getElementById('start-btn').addEventListener('click', () => {
                    this.initializeAudio();
                    this.startGame();
                });
                document.getElementById('restart-btn').addEventListener('click', () => this.restart());
                document.getElementById('download-excel-btn').addEventListener('click', () => this.downloadExcel());
                document.getElementById('copy-clipboard-btn').addEventListener('click', () => this.copyToClipboard());
                document.getElementById('file-upload').addEventListener('change', (e) => this.handleFileUpload(e));
            }

            handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                        
                        let names = [];
                        json.forEach(row => {
                            if (row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== '') {
                                names.push(String(row[0]).trim());
                            }
                        });

                        const ignoreHeaders = ['姓名', 'name', '座號', '名單', '學生'];
                        if (names.length > 0 && ignoreHeaders.includes(names[0].toLowerCase())) {
                            names.shift();
                        }

                        if (names.length === 0) {
                            alert('檔案中找不到可用的資料！請確保名單放在第一欄 (Column A)。');
                            return;
                        }

                        document.getElementById('custom-numbers').value = names.join('\n');
                        alert(`✅ 成功載入 ${names.length} 筆名單！`);
                        event.target.value = '';

                    } catch (error) {
                        console.error('檔案解析失敗', error);
                        alert('讀取檔案失敗，請確保上傳的是有效的 Excel 或 CSV 檔案！');
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            parseCustomNumbers(customString) {
                const numbers = [];
                const parts = customString.split(/[\n,、]/).map(part => part.trim()).filter(part => part !== '');
                
                for (const part of parts) {
                    if (part.includes('~')) {
                        const [start, end] = part.split('~').map(n => parseInt(n.trim()));
                        if (!isNaN(start) && !isNaN(end) && start <= end) {
                            for (let i = start; i <= end; i++) numbers.push(i.toString());
                        }
                    } else { 
                        numbers.push(part); 
                    }
                }
                return [...new Set(numbers)];
            }

            startGame() {
                const customNumbers = document.getElementById('custom-numbers').value.trim();
                const startNumber = parseInt(document.getElementById('start-number').value);
                const endNumber = parseInt(document.getElementById('end-number').value);
                const groupCount = parseInt(document.getElementById('group-count').value);
                
                const excludeInput = document.getElementById('exclude-numbers').value.trim();
                let excludeList = [];
                if (excludeInput) {
                    excludeList = excludeInput.split(/[\n,、\s]+/).map(n => n.trim()).filter(n => n !== '');
                }

                const blacklistInput = document.getElementById('blacklist').value.trim();
                let blacklistRules = [];
                if (blacklistInput) {
                    const lines = blacklistInput.split('\n');
                    lines.forEach(line => {
                        const rule = line.split(/[,、\s]+/).map(n => n.trim()).filter(n => n !== '');
                        if (rule.length > 1) {
                            blacklistRules.push(rule);
                        }
                    });
                }

                let availableNumbers = [];
                if (customNumbers) {
                    availableNumbers = this.parseCustomNumbers(customNumbers);
                    if (availableNumbers.length === 0) return alert('請確認文字框中有有效的名單！');
                } else {
                    if (isNaN(startNumber) || isNaN(endNumber) || startNumber > endNumber) return alert('請輸入有效的座號範圍！');
                    for (let i = startNumber; i <= endNumber; i++) availableNumbers.push(i.toString());
                }

                if (excludeList.length > 0) {
                    availableNumbers = availableNumbers.filter(n => !excludeList.includes(n));
                }

                if (availableNumbers.length === 0) return alert('扣除缺號後，名單變成空的了，請重新設定！');
                if (groupCount > availableNumbers.length || groupCount < 1) return alert(`❌ 錯誤：您要分的組數 (${groupCount}組) 比實際總人數 (${availableNumbers.length}人) 還多，請重新設定！`);

                let validGrouping = false;
                const maxRetries = 1000; 
                
                for (let retry = 0; retry < maxRetries; retry++) {
                    this.doGenerateGroups(availableNumbers, groupCount);
                    
                    if (blacklistRules.length === 0) {
                        validGrouping = true;
                        break;
                    }

                    let isCurrentValid = true;
                    for (const group of this.finalGroups) {
                        let allMembers = [group.leader];
                        if (group.viceLeader) allMembers.push(group.viceLeader);
                        allMembers = allMembers.concat(group.members);
                        
                        for (const rule of blacklistRules) {
                            const matchCount = rule.filter(person => allMembers.includes(person)).length;
                            if (matchCount > 1) {
                                isCurrentValid = false; 
                                break;
                            }
                        }
                        if (!isCurrentValid) break;
                    }

                    if (isCurrentValid) {
                        validGrouping = true;
                        break;
                    }
                }

                if (!validGrouping) {
                    alert('⚠️ 警告：無法找出完全符合「擴大社交圈」設定的分組方式（可能因為組數太少或互斥的人太多）。\n目前顯示的是未完全符合規則的隨機結果，請考慮增加組數或放寬規則。');
                }

                this.showGameStage();
                this.playFlipSound();
                this.showAllGroupResults();
            }

            doGenerateGroups(availableNumbers, groupCount) {
                const shuffled = [...availableNumbers];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                
                this.finalGroups = [];
                const baseSize = Math.floor(shuffled.length / groupCount);
                const remainder = shuffled.length % groupCount;
                let currentIndex = 0;
                
                for (let i = 0; i < groupCount; i++) {
                    const groupSize = baseSize + (i < remainder ? 1 : 0);
                    const groupMembers = shuffled.slice(currentIndex, currentIndex + groupSize);
                    
                    // 1. 隨機選出正組長
                    const leaderIndex = Math.floor(Math.random() * groupMembers.length);
                    const leader = groupMembers[leaderIndex];
                    let remainingMembers = groupMembers.filter((_, index) => index !== leaderIndex);
                    
                    // 2. 隨機選出副組長 (如果組員還剩下至少 1 人)
                    let viceLeader = null;
                    if (remainingMembers.length > 0) {
                        const viceLeaderIndex = Math.floor(Math.random() * remainingMembers.length);
                        viceLeader = remainingMembers[viceLeaderIndex];
                        remainingMembers = remainingMembers.filter((_, index) => index !== viceLeaderIndex);
                    }

                    this.finalGroups.push({ 
                        leader: leader, 
                        viceLeader: viceLeader,
                        members: remainingMembers, 
                        total: groupMembers.length 
                    });
                    currentIndex += groupSize;
                }
            }

            showGameStage() {
                const className = document.getElementById('class-name').value.trim();
                document.getElementById('result-title').textContent = className ? `🎉 ${className} 分組完成！` : '🎉 分組完成！';
                document.getElementById('setup-stage').classList.add('hidden');
                document.getElementById('action-buttons').classList.add('hidden');
                document.getElementById('cloud-tip').classList.add('hidden');
                
                const gameStage = document.getElementById('game-stage');
                gameStage.classList.remove('hidden');
                gameStage.classList.add('fade-in');
            }

            showAllGroupResults() {
                const mainGroupList = document.getElementById('main-group-list');
                mainGroupList.innerHTML = '';
                this.finalGroups.forEach((group, groupIndex) => {
                    setTimeout(() => {
                        this.playGroupSound(groupIndex);
                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'bg-gradient-to-r from-purple-100 to-blue-100 p-6 rounded-2xl mb-4 opacity-0 transform translate-y-8 shadow-lg';
                        
                        // 正組長 UI
                        const leaderHtml = `<div class="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-red-500 to-pink-500 px-4 py-2 md:px-5 md:py-3 rounded-lg inline-block mr-2 mb-2 shadow-lg border-2 border-yellow-400">👑 ${group.leader}</div>`;
                        
                        // 副組長 UI (如果有)
                        const viceLeaderHtml = group.viceLeader ? `<div class="text-2xl md:text-3xl font-bold text-white bg-gradient-to-r from-orange-400 to-yellow-500 px-4 py-2 md:px-5 md:py-3 rounded-lg inline-block mr-2 mb-2 shadow-lg border-2 border-orange-200">⭐ ${group.viceLeader}</div>` : '';
                        
                        // 一般組員 UI
                        const membersHtml = group.members.map(member => `<div class="text-xl md:text-3xl font-bold text-gray-800 bg-white px-4 py-2 md:px-5 md:py-3 rounded-lg inline-block mr-2 mb-2 shadow-md">${member}</div>`).join('');
                        
                        groupDiv.innerHTML = `<div class="text-xl md:text-2xl font-bold text-purple-700 mb-4">第 ${groupIndex + 1} 組 (${group.total}人)</div><div>${leaderHtml}${viceLeaderHtml}${membersHtml}</div>`;
                        mainGroupList.appendChild(groupDiv);
                        setTimeout(() => { groupDiv.classList.remove('opacity-0', 'translate-y-8'); groupDiv.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-700', 'ease-out'); }, 50);
                        if (groupIndex === this.finalGroups.length - 1) {
                            setTimeout(() => {
                                this.createConfetti();
                                document.getElementById('action-buttons').classList.remove('hidden');
                                document.getElementById('action-buttons').classList.add('fade-in', 'flex');
                                document.getElementById('cloud-tip').classList.remove('hidden');
                            }, 800);
                        }
                    }, groupIndex * 500);
                });
            }

            getFileName() {
                const className = document.getElementById('class-name').value.trim();
                return className ? `${className}_分組名單` : `分組名單`;
            }

            downloadExcel() {
                const excelData = [];
                this.finalGroups.forEach((group, index) => {
                    const groupName = `第 ${index + 1} 組`;
                    excelData.push({ "組別": groupName, "身份": "👑 正組長", "姓名/座號": group.leader });
                    
                    if (group.viceLeader) {
                        excelData.push({ "組別": groupName, "身份": "⭐ 副組長", "姓名/座號": group.viceLeader });
                    }

                    group.members.forEach(member => { 
                        excelData.push({ "組別": groupName, "身份": "組員", "姓名/座號": member }); 
                    });
                    
                    excelData.push({ "組別": "", "身份": "", "姓名/座號": "" });
                });
                
                const worksheet = XLSX.utils.json_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "分組結果");
                worksheet['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 20 }];
                XLSX.writeFile(workbook, `${this.getFileName()}.xlsx`);
            }

            copyToClipboard() {
                let textData = "組別\t身份\t姓名/座號\n"; 
                this.finalGroups.forEach((group, index) => {
                    const groupName = `第 ${index + 1} 組`;
                    textData += `${groupName}\t👑 正組長\t${group.leader}\n`;
                    
                    if (group.viceLeader) {
                        textData += `${groupName}\t⭐ 副組長\t${group.viceLeader}\n`;
                    }

                    group.members.forEach(member => {
                        textData += `${groupName}\t組員\t${member}\n`;
                    });
                    textData += `\t\t\n`; 
                });

                navigator.clipboard.writeText(textData).then(() => {
                    const btn = document.getElementById('copy-clipboard-btn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 複製成功！`;
                    btn.classList.replace('from-blue-500', 'from-green-500');
                    btn.classList.replace('to-indigo-600', 'to-emerald-600');
                    setTimeout(() => { 
                        btn.innerHTML = originalHTML; 
                        btn.classList.replace('from-green-500', 'from-blue-500');
                        btn.classList.replace('to-emerald-600', 'to-indigo-600');
                    }, 3000);
                }).catch(err => {
                    alert('複製失敗，請檢查瀏覽器權限！');
                    console.error('Copy failed', err);
                });
            }

            restart() {
                document.getElementById('game-stage').classList.add('hidden');
                document.getElementById('setup-stage').classList.remove('hidden');
                document.getElementById('main-group-list').innerHTML = '';
                this.finalGroups = [];
            }
        }

        document.addEventListener('DOMContentLoaded', () => { new RandomGroupGenerator(); });
    </script>
</body>
</html>
