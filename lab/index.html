<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪實驗進度＆目標管理面板 (AI 強化版)🧪</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        
        .lab-board {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
        .tech-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); }

        .num-badge {
            background-color: #0ea5e9; color: #ffffff; width: 40px; height: 40px;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; flex-shrink: 0; box-shadow: 0 3px 10px rgba(14, 165, 233, 0.4);
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <a href="../index.html" class="fixed top-3 left-3 z-50 bg-slate-800 text-sky-400 hover:text-white px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-700 shadow-lg flex items-center gap-1.5 transition-all" style="text-decoration:none">⬅️ 返回大廳三</a>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const Icon = ({ name, className = "", size = 18 }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px"></i>`;
                    window.lucide.createIcons();
                }
            }, [name, className, size]);
            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const apiKey = ""; // 請在此填入您的 Gemini API Key

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                const valueToStore = value instanceof Function ? value(storedValue) : value;
                setStoredValue(valueToStore);
                window.localStorage.setItem(key, JSON.stringify(valueToStore));
            };
            return [storedValue, setValue];
        }

        function App() {
            const [viewMode, setViewMode] = useState('both');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [viewDate, setViewDate] = useState(new Date());

            const [settings, setSettings] = useLocalStorage('lab-ai-pro-settings-v3', {
                totalGroups: 15,
                totalIndividuals: 40,
                idealTime: '11:30',
                cbFontSize: 32,
                classTitle: '有機化學實驗 (第A班)',
                dutyGroup: '', 
                emptyIds: '',
                leaveIds: '',
            });

            const [groups, setGroups] = useLocalStorage('lab-ai-pro-groups-v3', []);
            const [individuals, setIndividuals] = useLocalStorage('lab-ai-pro-individuals-v3', []);
            const [contactBookData, setContactBookData] = useLocalStorage('lab-ai-pro-goals-v3', {});
            const [taskData, setTaskData] = useLocalStorage('lab-ai-pro-tasks-v3', {});

            const formatDateKey = (date) => {
                const d = new Date(date);
                return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
            };
            const currentKey = formatDateKey(viewDate);

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                const emptySet = new Set(settings.emptyIds.split(',').map(s => parseInt(s.trim())));
                const leaveSet = new Set(settings.leaveIds.split(',').map(s => parseInt(s.trim())));
                
                setGroups(prev => {
                    return Array.from({ length: settings.totalGroups }, (_, i) => {
                        const id = i + 1;
                        const existing = prev.find(g => g.id === id);
                        let type = emptySet.has(id) ? 'empty' : leaveSet.has(id) ? 'leave' : 'normal';
                        return {
                            id, type,
                            expStatus: existing?.expStatus || 'pending', 
                            cleanStatus: existing?.cleanStatus || 'pending', 
                            time: existing?.time || null
                        };
                    });
                });

                setIndividuals(prev => {
                    return Array.from({ length: settings.totalIndividuals }, (_, i) => {
                        const id = i + 1;
                        const existing = prev.find(ind => ind.id === id);
                        return {
                            id,
                            hwStatus: existing?.hwStatus || 'submitted'
                        };
                    });
                });
            }, [settings.totalGroups, settings.totalIndividuals, settings.emptyIds, settings.leaveIds]);

            const toggleExperiment = (id) => {
                setGroups(prev => prev.map(g => {
                    if (g.id !== id || g.type !== 'normal') return g;
                    if (g.expStatus !== 'pending') return { ...g, expStatus: 'pending', time: null };
                    
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
                    const [h, m] = settings.idealTime.split(':').map(Number);
                    const ideal = new Date(); ideal.setHours(h, m, 59, 999);
                    return { ...g, time: timeStr, expStatus: now <= ideal ? 'completed' : 'overtime' };
                }));
            };

            const toggleCleanup = (id) => {
                setGroups(prev => prev.map(g => {
                    if (g.id !== id || g.type !== 'normal') return g;
                    return { ...g, cleanStatus: g.cleanStatus === 'pending' ? 'completed' : 'pending' };
                }));
            };

            const toggleHomework = (id) => {
                setIndividuals(prev => prev.map(ind => {
                    if (ind.id !== id) return ind;
                    return { ...ind, hwStatus: ind.hwStatus === 'submitted' ? 'missing' : 'submitted' };
                }));
            };

            const handleReset = () => {
                if(confirm('確定要重置今日所有「實驗」、「打掃」與「作業」進度嗎？')) {
                    setGroups(groups.map(g => ({...g, expStatus: 'pending', cleanStatus: 'pending', time: null})));
                    setIndividuals(individuals.map(ind => ({...ind, hwStatus: 'submitted'})));
                }
            };

            const exportCSV = () => {
                let csvContent = "\ufeff";
                csvContent += "=== 實驗與打掃進度 ===\n";
                csvContent += "組別,實驗狀態,完成時間,打掃狀態\n";
                groups.forEach(g => {
                    let expStr = g.type === 'empty' ? '無此組' : g.type === 'leave' ? '請假/故障' : g.expStatus === 'completed' ? '已繳交' : g.expStatus === 'overtime' ? '超時繳交' : '未繳交';
                    let clnStr = g.type === 'empty' || g.type === 'leave' ? '-' : g.cleanStatus === 'completed' ? '已打掃' : '未打掃';
                    csvContent += `${g.id},${expStr},${g.time || ''},${clnStr}\n`;
                });

                csvContent += "\n=== 個人作業缺交名單 ===\n";
                csvContent += "座號,作業狀態\n";
                const missingIds = individuals.filter(ind => ind.hwStatus === 'missing').map(ind => ind.id);
                if(missingIds.length > 0) {
                    missingIds.forEach(id => csvContent += `${id},未交\n`);
                } else {
                    csvContent += "無缺交紀錄\n";
                }

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `實驗進度報表_${currentKey}.csv`;
                link.click();
            };

            const callGemini = async (prompt) => {
                setIsAiLoading(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) { return null; }
                finally { setIsAiLoading(false); }
            };

            const handleAiOptimize = async () => {
                const current = contactBookData[currentKey] || "";
                if (!current) return;
                const res = await callGemini(`你是大學/高中的實驗課助教。請將以下的實驗步驟與注意事項，優化成條列清晰、具備安全提醒的內容，語氣專業且嚴謹，並使用繁體中文：\n${current}`);
                if (res) setContactBookData({ ...contactBookData, [currentKey]: res.trim() });
            };

            const handleAiTasks = async () => {
                const res = await callGemini(`請幫我生成三個通用的『實驗前準備與安全確認工作』（例如：穿著實驗衣與護目鏡、清點桌面玻璃器材、確認排氣設備運作）。請直接輸出三行內容，不要多餘贅字。`);
                if (res) setTaskData({ ...taskData, [currentKey]: res.trim() });
            };

            const changeDate = (offset) => {
                const newDate = new Date(viewDate);
                newDate.setDate(newDate.getDate() + offset);
                setViewDate(newDate);
            };

            return (
                <div className="h-screen w-screen flex flex-col overflow-hidden bg-[#0f172a]">
                    {/* 頂部導覽列 */}
                    <header className="h-16 bg-slate-800/80 backdrop-blur border-b border-slate-700 px-6 flex items-center justify-between shadow-sm shrink-0 z-50">
                        <div className="flex items-center gap-1 bg-slate-900/50 p-1 rounded-xl border border-slate-700">
                            <button onClick={() => setViewMode('both')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${viewMode === 'both' ? 'bg-cyan-500/20 text-cyan-400 shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="layout" className={viewMode === 'both' ? 'text-cyan-400' : ''} /> 全景監控
                            </button>
                            <button onClick={() => setViewMode('attendance')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${viewMode === 'attendance' ? 'bg-cyan-500/20 text-cyan-400 shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="check-square" /> 進度檢核
                            </button>
                            <button onClick={() => setViewMode('contact')} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-all ${viewMode === 'contact' ? 'bg-cyan-500/20 text-cyan-400 shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}>
                                <Icon name="target" /> 實驗目標
                            </button>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="flex gap-1 border-r border-slate-700 pr-3 mr-1">
                                <button onClick={handleReset} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 flex items-center gap-1 text-xs font-bold transition-colors">
                                    <Icon name="rotate-ccw" size={16} /> 重置
                                </button>
                                <button onClick={exportCSV} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 flex items-center gap-1 text-xs font-bold transition-colors">
                                    <Icon name="file-down" size={16} /> 下載報表
                                </button>
                            </div>
                            <button onClick={() => setIsSettingsOpen(true)} className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl font-bold text-sm flex items-center gap-2 transition-all">
                                <Icon name="settings" /> 設定
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 flex overflow-hidden p-4 gap-4">
                        
                        {/* 狀態檢核區 (左側) */}
                        {(viewMode === 'both' || viewMode === 'attendance') && (
                            <section className="flex flex-col gap-4 animate-slide-up" style={{ flex: viewMode === 'both' ? 5 : 1 }}>
                                
                                {/* 全新對稱排版：值日生 / 時間 / 班級 */}
                                <div className="bg-slate-800 rounded-[1.5rem] p-6 shadow-lg border border-slate-700 grid grid-cols-1 md:grid-cols-3 gap-6 items-center shrink-0">
                                    {/* 左側：今日值日生 */}
                                    <div className="flex flex-col items-start justify-center">
                                        <div className="text-amber-500 font-bold text-sm mb-2 flex items-center gap-2 tracking-wider">
                                            <Icon name="flag" size={18}/> 今日值日生
                                        </div>
                                        <input 
                                            type="text" 
                                            className="bg-slate-900 border-2 border-amber-500/50 rounded-xl text-amber-400 text-4xl lg:text-5xl w-32 py-2 outline-none focus:border-amber-400 text-center font-black font-mono-num shadow-[0_0_15px_rgba(245,158,11,0.1)] transition-all placeholder:text-slate-700"
                                            placeholder="組別" 
                                            value={settings.dutyGroup} 
                                            onChange={e => setSettings({...settings, dutyGroup: e.target.value})} 
                                        />
                                    </div>

                                    {/* 中間：系統時間 */}
                                    <div className="flex flex-col items-center justify-center text-center">
                                        <div className="text-5xl lg:text-7xl font-black text-white tracking-tighter font-mono-num mb-1 drop-shadow-lg">
                                            {currentTime.toLocaleTimeString('zh-TW', { hour12: false })}
                                        </div>
                                        <div className="text-slate-400 text-sm font-bold tracking-widest uppercase mt-1">
                                            {currentTime.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' })}
                                        </div>
                                    </div>

                                    {/* 右側：班級資訊 */}
                                    <div className="flex flex-col items-end justify-center text-right">
                                        <div className="text-2xl lg:text-3xl font-black text-cyan-400 mb-3 drop-shadow-sm">
                                            {settings.classTitle}
                                        </div>
                                        <div className="text-sm font-bold text-rose-400 bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20 flex items-center gap-1.5">
                                            <Icon name="alert-circle" size={16} /> 預定繳交底線: {settings.idealTime}
                                        </div>
                                    </div>
                                </div>

                                {/* 三大點選區 (滾動容器) */}
                                <div className="flex-1 bg-slate-800 rounded-[1.5rem] shadow-lg border border-slate-700 overflow-hidden flex flex-col">
                                    <div className="flex-1 overflow-y-auto p-6 space-y-8 custom-scrollbar">
                                        
                                        {/* 1. 實驗完成組別點選 */}
                                        <div>
                                            <h3 className="text-cyan-400 font-bold mb-3 flex items-center gap-2 text-sm">
                                                <Icon name="beaker" size={18}/> 實驗數據繳交狀況 (組別)
                                            </h3>
                                            <div className="grid grid-cols-4 md:grid-cols-5 xl:grid-cols-6 gap-3">
                                                {groups.map(g => (
                                                    <button 
                                                        key={`exp-${g.id}`} onClick={() => toggleExperiment(g.id)}
                                                        className={`relative p-2 rounded-xl border-2 flex flex-col items-center justify-center transition-all active:scale-95
                                                            ${g.type === 'empty' ? 'bg-slate-800/50 border-slate-700 opacity-30 cursor-not-allowed' : 
                                                              g.type === 'leave' ? 'bg-slate-800 border-dashed border-slate-600 text-slate-500 cursor-not-allowed' :
                                                              g.expStatus === 'completed' ? 'bg-cyan-900/30 border-cyan-500 text-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.15)]' :
                                                              g.expStatus === 'overtime' ? 'bg-amber-900/30 border-amber-500 text-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.1)]' :
                                                              'bg-slate-700/50 border-slate-600 text-slate-300 hover:border-cyan-500/50'}`}
                                                    >
                                                        <span className="text-lg font-black font-mono-num">{g.id}</span>
                                                        {g.expStatus !== 'pending' && <span className="text-[10px] font-mono-num opacity-80 mt-1">{g.time}</span>}
                                                        {g.expStatus === 'pending' && <span className="text-[10px] opacity-50 mt-1">未繳交</span>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <hr className="border-slate-700" />

                                        {/* 2. 打掃完成點選區 */}
                                        <div>
                                            <h3 className="text-emerald-400 font-bold mb-3 flex items-center gap-2 text-sm">
                                                <Icon name="sparkles" size={18}/> 實驗桌清理與打掃 (組別)
                                            </h3>
                                            <div className="grid grid-cols-4 md:grid-cols-5 xl:grid-cols-6 gap-3">
                                                {groups.map(g => (
                                                    <button 
                                                        key={`cln-${g.id}`} onClick={() => toggleCleanup(g.id)}
                                                        className={`relative py-2 rounded-xl border-2 flex flex-col items-center justify-center transition-all active:scale-95
                                                            ${g.type === 'empty' ? 'hidden' : 
                                                              g.type === 'leave' ? 'bg-slate-800 border-dashed border-slate-600 text-slate-500 cursor-not-allowed' :
                                                              g.cleanStatus === 'completed' ? 'bg-emerald-900/30 border-emerald-500 text-emerald-400 shadow-[0_0_10px_rgba(16,185,129,0.15)]' :
                                                              'bg-slate-700/30 border-slate-600 text-slate-400 hover:border-emerald-500/50'}`}
                                                    >
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-black font-mono-num">{g.id}</span>
                                                            {g.cleanStatus === 'completed' && <Icon name="check-circle-2" size={14} />}
                                                        </div>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <hr className="border-slate-700" />

                                        {/* 3. 個人作業未完成名單 */}
                                        <div>
                                            <h3 className="text-rose-400 font-bold mb-3 flex items-center gap-2 text-sm">
                                                <Icon name="user-x" size={18}/> 個人作業未完成名單 (座號)
                                            </h3>
                                            <div className="text-xs text-slate-400 mb-3">※ 點擊座號標記為「未交」紅燈狀態</div>
                                            <div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 xl:grid-cols-10 gap-2">
                                                {individuals.map(ind => (
                                                    <button 
                                                        key={`ind-${ind.id}`} onClick={() => toggleHomework(ind.id)}
                                                        className={`w-full aspect-square rounded-full border-2 flex items-center justify-center transition-all text-sm font-bold font-mono-num
                                                            ${ind.hwStatus === 'missing' 
                                                                ? 'bg-rose-500/20 border-rose-500 text-rose-400 shadow-[0_0_10px_rgba(244,63,94,0.3)] scale-110' 
                                                                : 'bg-slate-800 border-slate-700 text-slate-500 hover:border-slate-500'}`}
                                                    >
                                                        {ind.id}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </section>
                        )}

                        {/* 實驗目標區 (右側) */}
                        {(viewMode === 'both' || viewMode === 'contact') && (
                            <section className="flex flex-col lab-board animate-slide-up" style={{ flex: viewMode === 'both' ? 7 : 1 }}>
                                <div className="p-8 pb-4 shrink-0 flex items-center justify-between border-b border-slate-700/50">
                                    <div className="flex flex-col gap-2">
                                        <div className="flex items-center gap-3">
                                            <div className="w-12 h-12 bg-cyan-500/20 border border-cyan-500 rounded-xl flex items-center justify-center text-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.2)]">
                                                <Icon name="target" size={26} />
                                            </div>
                                            <h2 className="text-3xl font-black text-slate-100 tracking-wide">今日實驗目標與規範</h2>
                                        </div>
                                        <div className="flex items-center gap-2 mt-2">
                                            <button onClick={()=>changeDate(-1)} className="p-1 text-slate-500 hover:text-cyan-400 transition-colors"><Icon name="chevron-left" /></button>
                                            <span className="bg-slate-800 border border-slate-700 px-4 py-1 rounded-md text-cyan-400 font-mono-num font-bold tracking-wider text-sm">
                                                {currentKey} 
                                            </span>
                                            <button onClick={()=>changeDate(1)} className="p-1 text-slate-500 hover:text-cyan-400 transition-colors"><Icon name="chevron-right" /></button>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-2 items-end">
                                        <div className="bg-slate-800/80 p-1 rounded-lg flex items-center gap-1 border border-slate-700">
                                            <button onClick={()=>setSettings({...settings, cbFontSize: Math.max(16, settings.cbFontSize-2)})} className="px-2 py-1 text-slate-300 hover:text-white rounded font-bold">A-</button>
                                            <span className="text-cyan-500 font-mono-num px-2 text-xs">{settings.cbFontSize}</span>
                                            <button onClick={()=>setSettings({...settings, cbFontSize: Math.min(64, settings.cbFontSize+2)})} className="px-2 py-1 text-slate-300 hover:text-white rounded font-bold">A+</button>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={()=>setIsEditing(!isEditing)} className={`px-5 py-2 rounded-xl font-bold text-sm shadow-lg transition-all border ${isEditing ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500 hover:bg-emerald-500/30' : 'bg-cyan-600 text-white border-cyan-500 hover:bg-cyan-500'}`}>
                                                {isEditing ? '儲存規範' : '編輯內容'}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex-1 p-8 overflow-y-auto tech-scrollbar">
                                    {isEditing ? (
                                        <div className="h-full flex flex-col gap-4">
                                            <textarea 
                                                className="flex-1 bg-slate-900/50 border border-slate-700 rounded-xl p-6 text-slate-200 text-2xl font-medium outline-none resize-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all leading-relaxed"
                                                value={contactBookData[currentKey] || ''}
                                                onChange={(e) => setContactBookData({...contactBookData, [currentKey]: e.target.value})}
                                                placeholder="請輸入今日實驗步驟與注意事項..."
                                            />
                                            <div className="flex gap-4">
                                                <button onClick={handleAiOptimize} disabled={isAiLoading} className="flex-1 py-3 bg-indigo-500/10 text-indigo-400 rounded-xl font-bold border border-indigo-500/30 hover:bg-indigo-500/20 flex items-center justify-center gap-2 transition-colors">
                                                    {isAiLoading ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="sparkles" />} AI 優化步驟與安全提醒
                                                </button>
                                                <button onClick={handleAiTasks} disabled={isAiLoading} className="flex-1 py-3 bg-amber-500/10 text-amber-400 rounded-xl font-bold border border-amber-500/30 hover:bg-amber-500/20 flex items-center justify-center gap-2 transition-colors">
                                                    <Icon name="shield-check" /> 產生實驗前安全確認清單
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-slate-200 space-y-8" style={{ fontSize: `${settings.cbFontSize}px` }}>
                                            <div className="space-y-6">
                                                {(contactBookData[currentKey] || "").split('\n').filter(l => l.trim()).map((line, idx) => (
                                                    <div key={idx} className="flex gap-5 items-start bg-slate-800/30 p-5 rounded-xl border border-slate-700/50 hover:bg-slate-800/50 transition-colors">
                                                        <div className="num-badge text-lg">{idx + 1}</div>
                                                        <div className="flex-1 leading-relaxed font-bold">{line}</div>
                                                    </div>
                                                ))}
                                                {(!contactBookData[currentKey] || contactBookData[currentKey].trim() === "") && (
                                                    <div className="text-center text-slate-500 italic text-xl py-10">尚無實驗目標資料，請點擊右上角「編輯內容」新增。</div>
                                                )}
                                            </div>

                                            {taskData[currentKey] && taskData[currentKey].trim() !== "" && (
                                                <div className="mt-12 p-8 bg-slate-900/50 border border-amber-500/20 rounded-2xl relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-1.5 h-full bg-amber-500"></div>
                                                    <div className="flex items-center gap-3 mb-6">
                                                        <Icon name="alert-triangle" className="text-amber-500" size={Math.max(24, settings.cbFontSize * 0.8)} />
                                                        <span className="text-amber-500 font-bold tracking-wide" style={{ fontSize: `${Math.max(20, settings.cbFontSize * 0.85)}px` }}>實驗前準備與安全確認</span>
                                                    </div>
                                                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
                                                        {(taskData[currentKey] || "").split('\n').filter(l => l.trim()).map((task, idx) => (
                                                            <div key={idx} className="flex items-start gap-3 bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                                                                <div className="mt-1"><Icon name="check-square" className="text-slate-500" size={Math.max(20, settings.cbFontSize * 0.7)} /></div>
                                                                <span className="text-slate-300 font-bold leading-relaxed" style={{ fontSize: `${Math.max(18, settings.cbFontSize * 0.75)}px` }}>{task}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="h-2 w-full bg-gradient-to-r from-cyan-600 via-indigo-600 to-slate-800 shrink-0 opacity-80"></div>
                            </section>
                        )}
                    </main>

                    {/* 設定 Modal */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                            <div className="bg-slate-800 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden border border-slate-700">
                                <div className="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                                    <h3 className="text-xl font-black text-white flex items-center gap-2"><Icon name="sliders" className="text-cyan-400" /> 系統進階設定</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition-colors">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-6 tech-scrollbar space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[11px] font-black text-cyan-500 mb-1.5">課程名稱 / 班級</label>
                                            <input type="text" className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white outline-none focus:border-cyan-500" value={settings.classTitle} onChange={e => setSettings({...settings, classTitle: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-cyan-500 mb-1.5">預定繳交時間 (超時判定)</label>
                                            <input type="time" className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white font-mono-num outline-none focus:border-cyan-500" value={settings.idealTime} onChange={e => setSettings({...settings, idealTime: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-cyan-500 mb-1.5">實驗總組數</label>
                                            <input type="number" min="1" max="50" className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white font-mono-num outline-none focus:border-cyan-500" value={settings.totalGroups} onChange={e => setSettings({...settings, totalGroups: parseInt(e.target.value) || 15})} />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-rose-400 mb-1.5">班級總人數 (個人作業檢核用)</label>
                                            <input type="number" min="1" max="100" className="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-white font-mono-num outline-none focus:border-rose-400" value={settings.totalIndividuals} onChange={e => setSettings({...settings, totalIndividuals: parseInt(e.target.value) || 40})} />
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <div className="flex items-center gap-3 bg-slate-900/50 p-3 rounded-xl border border-slate-700">
                                            <Icon name="slash" className="text-slate-500" />
                                            <div className="flex-1">
                                                <label className="block text-[10px] font-black text-slate-400 uppercase mb-0.5">空號組別 (以逗號隔開)</label>
                                                <input type="text" className="w-full bg-transparent text-white font-mono-num outline-none text-sm" placeholder="e.g. 5, 12" value={settings.emptyIds} onChange={e => setSettings({...settings, emptyIds: e.target.value})} />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 border-t border-slate-700 bg-slate-800/50">
                                    <button onClick={() => setIsSettingsOpen(false)} className="w-full py-3 bg-cyan-600 text-white rounded-xl font-bold shadow-lg hover:bg-cyan-500 transition-all">儲存並關閉</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
