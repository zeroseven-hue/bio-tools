<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>與時間賽跑 - 戰術儀表板 (優化爆炸視覺)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');

        body { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        .gradient-bg {
            background: radial-gradient(circle at center, #2d3436 0%, #000000 100%);
            transition: background 0.5s ease;
        }
        .danger-bg { background: radial-gradient(circle at center, #4a0000 0%, #000000 100%); }

        /* 時間顯示字體 */
        .font-mono-timer { font-family: 'JetBrains Mono', monospace; }

        /* 動畫優化 */
        .timer-pulse { animation: pulse 2s ease-in-out infinite; }
        .timer-urgent { animation: pulse 0.5s ease-in-out infinite; color: #ff4757 !important; }
        .timer-overtime { animation: pulse 0.5s ease-in-out infinite; color: #ff0000 !important; text-shadow: 0 0 20px #ff0000; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .progress-circle { 
            transition: stroke-dashoffset 0.3s linear, stroke 0.3s ease; 
        }

        .button-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .button-hover:active { transform: scale(0.95); }

        /* --- 修改後的爆炸特效 --- */
        .explosion {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            /* 改為環狀衝擊波漸層，中間透明 */
            background: radial-gradient(circle, transparent 0%, transparent 30%, #fff 40%, #ff0 50%, #f90 60%, transparent 70%);
            border-radius: 50%; 
            pointer-events: none; 
            z-index: 15; /* 將層級調低，讓它在數字(z-index:20)的後面 */
            mix-blend-mode: screen; /* 讓光效疊加看起來更亮、更通透 */
        }
        
        /* 隱藏數字輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* 任務清單自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="gradient-bg h-screen overflow-hidden text-white flex flex-col">

    <div class="fixed top-6 left-6 right-6 flex justify-between items-center z-50">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-full backdrop-blur-md text-sm font-bold text-white flex items-center gap-1.5 transition-colors" style="text-decoration:none">⬅️ 返回大廳三</a>
            <div class="text-xl font-bold tracking-tighter opacity-50 hidden sm:block">TACTICAL DASHBOARD</div>
        </div>
        <button id="soundToggle" class="bg-white/10 hover:bg-white/20 p-4 rounded-full backdrop-blur-md button-hover">
            <span id="soundIcon" class="text-2xl">🔊</span>
        </button>
    </div>

    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center gap-12 pt-24 pb-8 px-8 overflow-y-auto custom-scrollbar w-full max-w-6xl mx-auto">
        
        <div class="flex flex-col items-center w-full lg:w-1/2 max-w-md">
            <div class="relative group mt-4">
                <div id="bgPulse" class="absolute inset-0 bg-red-600/20 rounded-full blur-3xl scale-0 transition-transform duration-500 z-0"></div>
                
                <svg class="w-64 h-64 md:w-80 md:h-80 -rotate-90 relative z-10 mx-auto" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="56" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.1"/>
                    <circle id="progressCircle" cx="60" cy="60" r="56" fill="none" 
                            stroke="white" stroke-width="4" stroke-linecap="round"
                            stroke-dasharray="351.85" stroke-dashoffset="0" class="progress-circle"/>
                </svg>

                <div class="absolute inset-0 flex flex-col items-center justify-center z-20">
                    <div id="timeWrapper" class="timer-pulse flex flex-col items-center">
                        <span id="displayTime" class="text-6xl md:text-7xl font-mono-timer font-bold tracking-tighter transition-colors">15:00</span>
                        <span id="statusText" class="text-xs uppercase tracking-[0.4em] opacity-40 mt-2">Ready</span>
                    </div>
                </div>

                <div id="explosion" class="explosion opacity-0"></div>
            </div>

            <div class="mt-8 flex flex-col items-center gap-6 w-full">
                <div class="flex gap-4">
                    <button id="playPauseBtn" class="bg-white text-black px-10 py-3 rounded-full text-lg font-black button-hover shadow-xl">START</button>
                    <button id="resetBtn" class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-full font-bold button-hover">RESET</button>
                </div>

                <div class="flex flex-wrap justify-center gap-2">
                    <button data-time="1" class="time-preset px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">1m</button>
                    <button data-time="5" class="time-preset px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">5m</button>
                    <button data-time="15" class="time-preset px-4 py-2 rounded-lg bg-white/20 text-sm border border-white/30">15m</button>
                    <button data-time="30" class="time-preset px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm">30m</button>
                    <button id="customBtn" class="px-4 py-2 rounded-lg bg-purple-600/40 hover:bg-purple-600/60 text-sm border border-purple-400/30">CUSTOM</button>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-1/2 max-w-md bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-sm shadow-2xl h-[500px] flex flex-col">
            <h2 class="text-xs font-bold tracking-[0.2em] text-white/50 mb-4 uppercase flex items-center gap-2 shrink-0">
                <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                Mission Objectives
            </h2>
            
            <div class="flex gap-2 mb-4 shrink-0">
                <input id="taskInput" type="text" placeholder="輸入要完成的任務..." class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-purple-500 focus:bg-white/5 focus:outline-none transition-all placeholder:text-white/20">
                <button id="addTaskBtn" class="bg-purple-600/80 hover:bg-purple-500 px-5 py-3 rounded-xl text-lg font-bold transition-colors shadow-lg shadow-purple-900/20 button-hover">+</button>
            </div>
            
            <ul id="taskList" class="flex-1 flex flex-col gap-2 overflow-y-auto pr-2 custom-scrollbar">
                </ul>
        </div>

    </main>

    <div id="customModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center hidden z-[100]">
        <div class="bg-neutral-900 p-8 rounded-3xl border border-white/10 w-80 text-center shadow-2xl">
            <h3 class="text-xl font-bold mb-6 tracking-wide">SET DURATION</h3>
            
            <div class="flex gap-4 mb-8">
                <div class="flex-1">
                    <label class="block text-xs font-bold text-white/50 mb-2 tracking-wider">MIN</label>
                    <input id="customMin" type="number" min="0" placeholder="00" class="bg-white/5 border border-white/20 rounded-xl px-2 py-4 w-full text-center text-3xl font-mono-timer focus:border-purple-500 focus:bg-white/10 transition-all outline-none">
                </div>
                <div class="flex items-center text-2xl font-bold opacity-50 pt-6">:</div>
                <div class="flex-1">
                    <label class="block text-xs font-bold text-white/50 mb-2 tracking-wider">SEC</label>
                    <input id="customSec" type="number" min="0" max="59" placeholder="00" class="bg-white/5 border border-white/20 rounded-xl px-2 py-4 w-full text-center text-3xl font-mono-timer focus:border-purple-500 focus:bg-white/10 transition-all outline-none">
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="timer.hideModal()" class="flex-1 py-3 bg-white/5 hover:bg-white/10 rounded-xl font-bold transition-colors">Cancel</button>
                <button onclick="timer.confirmCustom()" class="flex-1 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition-colors shadow-lg shadow-purple-900/50">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        class TimeRush {
            constructor() {
                this.config = {
                    initialMinutes: 15,
                    circumference: 2 * Math.PI * 56
                };
                
                this.state = {
                    totalSeconds: this.config.initialMinutes * 60,
                    remaining: this.config.initialMinutes * 60,
                    isRunning: false,
                    soundEnabled: true,
                    hasExploded: false
                };

                this.dom = {
                    display: document.getElementById('displayTime'),
                    progress: document.getElementById('progressCircle'),
                    playBtn: document.getElementById('playPauseBtn'),
                    bgPulse: document.getElementById('bgPulse'),
                    timeWrapper: document.getElementById('timeWrapper'),
                    status: document.getElementById('statusText'),
                    taskInput: document.getElementById('taskInput'),
                    addTaskBtn: document.getElementById('addTaskBtn'),
                    taskList: document.getElementById('taskList')
                };

                this.audioCtx = null;
                this.init();
            }

            init() {
                this.dom.playBtn.onclick = () => this.toggle();
                document.getElementById('resetBtn').onclick = () => this.reset();
                document.getElementById('soundToggle').onclick = () => this.toggleSound();
                document.getElementById('customBtn').onclick = () => this.showModal();
                
                document.querySelectorAll('.time-preset').forEach(btn => {
                    btn.onclick = (e) => this.setPreset(e.target);
                });

                window.onkeydown = (e) => { 
                    if(e.code === 'Space' && 
                       document.getElementById('customModal').classList.contains('hidden') && 
                       document.activeElement !== this.dom.taskInput) {
                        e.preventDefault();
                        this.toggle(); 
                    }
                };

                document.getElementById('customSec').onkeydown = (e) => { if (e.key === 'Enter') this.confirmCustom(); };
                document.getElementById('customMin').onkeydown = (e) => { if (e.key === 'Enter') this.confirmCustom(); };
                
                this.dom.addTaskBtn.onclick = () => this.addTask();
                this.dom.taskInput.onkeydown = (e) => { if (e.key === 'Enter') this.addTask(); };

                this.addTask("破解系統防火牆");
                this.addTask("覆寫安全協定");

                this.updateDisplay();
            }

            playDing() {
                if (!this.state.soundEnabled || !this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, this.audioCtx.currentTime); 
                
                gain.gain.setValueAtTime(0, this.audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.6, this.audioCtx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                
                osc.start(this.audioCtx.currentTime);
                osc.stop(this.audioCtx.currentTime + 0.5);
            }

            addTask(presetText = null) {
                const text = presetText || this.dom.taskInput.value.trim();
                if (!text) return;

                const li = document.createElement('li');
                li.className = 'group flex items-center justify-between bg-black/20 p-3 rounded-xl hover:bg-white/5 transition-all cursor-pointer border border-white/5 hover:border-white/10 shrink-0';
                
                li.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-5 h-5 rounded-full border-2 border-white/30 flex-shrink-0 group-[.completed]:bg-purple-500 group-[.completed]:border-purple-500 transition-colors flex items-center justify-center">
                            <svg class="w-3 h-3 text-white opacity-0 group-[.completed]:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <span class="text-sm tracking-wide truncate transition-all group-[.completed]:line-through group-[.completed]:opacity-40 group-[.completed]:text-white/70">${text}</span>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 text-white/30 hover:text-red-400 transition-all px-2 focus:outline-none">✕</button>
                `;

                li.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        if (li.classList.toggle('completed')) this.playDing();
                    }
                };

                li.querySelector('button').onclick = (e) => {
                    e.stopPropagation();
                    li.style.transform = 'scale(0.95)';
                    li.style.opacity = '0';
                    setTimeout(() => li.remove(), 200);
                };

                this.dom.taskList.appendChild(li);
                this.dom.taskInput.value = '';
                this.dom.taskList.scrollTop = this.dom.taskList.scrollHeight;
            }

            toggle() {
                if (this.state.isRunning) this.pause();
                else this.start();
            }

            start() {
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                
                this.state.isRunning = true;
                this.dom.playBtn.innerText = 'PAUSE';
                
                this.dom.status.innerText = this.state.hasExploded ? 'CRITICAL OVERTIME' : 'Racing...';
                
                this.timerInterval = setInterval(() => {
                    this.state.remaining--;
                    this.updateDisplay();
                    this.playTick();
                    
                    if (this.state.remaining === 0 && !this.state.hasExploded) {
                        this.triggerExplosion();
                    }
                }, 1000);
            }

            pause() {
                this.state.isRunning = false;
                this.dom.playBtn.innerText = 'RESUME';
                this.dom.status.innerText = 'Paused';
                clearInterval(this.timerInterval);
            }

            reset() {
                this.pause();
                this.state.remaining = this.state.totalSeconds;
                this.state.hasExploded = false;
                this.dom.playBtn.innerText = 'START';
                this.dom.status.innerText = 'Ready';
                this.dom.timeWrapper.className = 'timer-pulse flex flex-col items-center';
                document.body.classList.remove('danger-bg');
                this.updateDisplay();
            }

            setPreset(el) {
                const mins = parseInt(el.dataset.time);
                this.state.totalSeconds = mins * 60;
                document.querySelectorAll('.time-preset').forEach(b => b.classList.remove('bg-white/20', 'border-white/30'));
                el.classList.add('bg-white/20', 'border-white/30');
                this.reset();
            }

            updateDisplay() {
                const absSeconds = Math.abs(this.state.remaining);
                const m = Math.floor(absSeconds / 60);
                const s = absSeconds % 60;
                
                let timeString = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                if (this.state.remaining < 0) {
                    timeString = "+" + timeString;
                }
                
                this.dom.display.innerText = timeString;
                
                if (this.state.remaining <= 0) {
                    this.dom.progress.style.strokeDashoffset = this.config.circumference;
                } else {
                    const offset = this.config.circumference - (this.state.remaining / this.state.totalSeconds) * this.config.circumference;
                    this.dom.progress.style.strokeDashoffset = offset;
                }

                if (this.state.remaining < 0) {
                    this.dom.timeWrapper.className = 'timer-overtime flex flex-col items-center';
                    this.dom.progress.setAttribute('stroke', '#ff0000');
                    this.dom.bgPulse.style.transform = 'scale(2)';
                    document.body.classList.add('danger-bg');
                } else if (this.state.remaining <= 10 && this.state.remaining > 0 && this.state.isRunning) {
                    this.dom.timeWrapper.className = 'timer-urgent flex flex-col items-center';
                    this.dom.progress.setAttribute('stroke', '#ff4757');
                    this.dom.bgPulse.style.transform = 'scale(1.5)';
                    document.body.classList.add('danger-bg');
                } else {
                    this.dom.timeWrapper.className = 'timer-pulse flex flex-col items-center';
                    this.dom.progress.setAttribute('stroke', 'white');
                    this.dom.bgPulse.style.transform = 'scale(0)';
                    document.body.classList.remove('danger-bg');
                }
            }

            playTick() {
                if (!this.state.soundEnabled || !this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain); gain.connect(this.audioCtx.destination);
                
                osc.frequency.value = this.state.remaining < 10 ? 1200 : 800;
                
                gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(this.audioCtx.currentTime + 0.05);
            }

            triggerExplosion() {
                this.state.hasExploded = true;
                this.dom.status.innerText = 'CRITICAL OVERTIME';
                this.playExplosion();
                
                this.dom.timeWrapper.animate([
                    { transform: 'translateX(-15px) scale(1.1)' },
                    { transform: 'translateX(15px) scale(1.1)' }
                ], { duration: 80, iterations: 12 });
            }

            playExplosion() {
                const exp = document.getElementById('explosion');
                exp.classList.remove('opacity-0');
                // 稍微調整了動畫，讓衝擊波擴散得更大更快
                exp.animate([
                    { transform: 'translate(-50%, -50%) scale(0.1)', opacity: 1 },
                    { transform: 'translate(-50%, -50%) scale(4)', opacity: 0 }
                ], { duration: 1000, easing: 'ease-out' });

                if (!this.state.soundEnabled) return;
                const bufferSize = this.audioCtx.sampleRate * 1.5;
                const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                
                const noise = this.audioCtx.createBufferSource();
                const filter = this.audioCtx.createBiquadFilter();
                const g = this.audioCtx.createGain();
                
                noise.buffer = buffer;
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(40, this.audioCtx.currentTime + 1.2);
                
                g.gain.setValueAtTime(0.6, this.audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 1.5);
                
                noise.connect(filter); filter.connect(g); g.connect(this.audioCtx.destination);
                noise.start();
            }

            showModal() { 
                document.getElementById('customModal').classList.remove('hidden');
                const m = Math.floor(this.state.totalSeconds / 60);
                const s = this.state.totalSeconds % 60;
                document.getElementById('customMin').value = m || '';
                document.getElementById('customSec').value = s || '';
                document.getElementById('customMin').focus();
            }
            
            hideModal() { 
                document.getElementById('customModal').classList.add('hidden'); 
            }
            
            confirmCustom() {
                const mins = parseInt(document.getElementById('customMin').value) || 0;
                const secs = parseInt(document.getElementById('customSec').value) || 0;
                const total = (mins * 60) + secs;

                if (total > 0) {
                    this.state.totalSeconds = total;
                    document.querySelectorAll('.time-preset').forEach(b => b.classList.remove('bg-white/20', 'border-white/30'));
                    this.reset();
                    this.hideModal();
                }
            }

            toggleSound() {
                this.state.soundEnabled = !this.state.soundEnabled;
                document.getElementById('soundIcon').innerText = this.state.soundEnabled ? '🔊' : '🔇';
            }
        }

        const timer = new TimeRush();
    </script>
</body>
</html>
