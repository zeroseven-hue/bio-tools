<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const els={clock:$('clock'),themeToggle:$('themeToggle'),arena:$('arena'),dino:$('dino'),status:$('status'),timer:$('timer'),stageTimer:$('stageTimer'),stageHp:$('stageHp'),hpText:$('hpText'),hpFill:$('hpFill'),level:$('level'),meterFill:$('meterFill'),thresholdMark:$('thresholdMark'),markText:$('markText'),minutes:$('minutes'),threshold:$('threshold'),thresholdValue:$('thresholdValue'),sensitivity:$('sensitivity'),sensitivityValue:$('sensitivityValue'),burstDuration:$('burstDuration'),burstValue:$('burstValue'),soundOn:$('soundOn'),recovery:$('recovery'),calibrate:$('calibrate'),stagePause:$('stagePause'),volume:$('volume'),volumeValue:$('volumeValue'),start:$('start'),pause:$('pause'),reset:$('reset'),fullscreen:$('fullscreen'),exitFullscreen:$('exitFullscreen'),testSound:$('testSound'),help:$('help')};let state='idle',remaining=900,hp=100,smoothed=0,loudFor=0,calmFor=0,lastFrame=0,deadline=0,raf=0,stream=null,context=null,source=null,filter=null,analyser=null,finishTimer=0,stage=1;const sens=[.5,.8,1.2,1.8,2.5],sensLabel=['極低','低','中等','高','極高'];function clock(){els.clock.textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false})}clock();setInterval(clock,1000);function applyTheme(dark){document.body.classList.toggle('dark',dark);els.themeToggle.textContent=dark?'☀ 明亮風格':'☾ 暗色風格';els.themeToggle.setAttribute('aria-pressed',String(dark));try{localStorage.setItem('guardian-theme',dark?'dark':'light')}catch{}}let initialTheme='light';try{initialTheme=localStorage.getItem('guardian-theme')||'light'}catch{}applyTheme(initialTheme==='dark');els.themeToggle.onclick=()=>applyTheme(!document.body.classList.contains('dark'));function fmt(s){s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function duration(){let n=Number(els.minutes.value);if(!Number.isFinite(n))n=15;n=Math.max(1,Math.min(180,Math.trunc(n)));els.minutes.value=n;return n*60}function paint(){els.timer.textContent=fmt(remaining);els.stageTimer.textContent=fmt(remaining);els.stageHp.textContent=Math.ceil(hp);els.hpText.textContent=`${Math.ceil(hp)} / 100`;els.hpFill.style.width=hp+'%';els.hpFill.style.background=hp>50?'#46b982':hp>20?'#e6b84d':'#e76563';els.meterFill.style.width=Math.round(smoothed)+'%';els.level.textContent=Math.round(smoothed)+'%'}function setStage(n,msg){if(stage===n&&els.status.textContent===msg)return;stage=n;els.arena.dataset.stage=String(n);els.dino.dataset.stage=String(n);els.status.textContent=msg;els.dino.setAttribute('aria-label',msg)}function controls(){els.start.disabled=state!=='idle';els.pause.disabled=!['running','paused'].includes(state);els.pause.textContent=state==='paused'?'▶ 繼續':'Ⅱ 暫停';els.stagePause.disabled=els.pause.disabled;els.stagePause.textContent=els.pause.textContent;els.calibrate.disabled=state!=='idle';els.reset.disabled=state==='idle';els.minutes.disabled=state!=='idle'}function updateThreshold(){els.thresholdValue.textContent=els.threshold.value+'%';els.markText.textContent=els.threshold.value+'%';els.thresholdMark.style.left=els.threshold.value+'%'}els.threshold.oninput=updateThreshold;updateThreshold();els.sensitivity.oninput=()=>els.sensitivityValue.textContent=sensLabel[Number(els.sensitivity.value)-1];els.burstDuration.oninput=()=>els.burstValue.textContent=els.burstDuration.value+' 秒';els.volume.oninput=()=>els.volumeValue.textContent=els.volume.value+'%';els.minutes.onchange=()=>{if(state==='idle'){remaining=duration();paint()}};els.fullscreen.onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else els.arena.requestFullscreen?.()};els.exitFullscreen.onclick=()=>document.exitFullscreen?.();els.stagePause.onclick=()=>els.pause.click();function closeMic(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}source?.disconnect();filter?.disconnect();analyser?.disconnect();source=filter=analyser=null;if(context){context.close().catch(()=>{});context=null}}async function openMic(){if(!navigator.mediaDevices?.getUserMedia)throw Error('請使用支援麥克風的安全頁面（HTTPS 或本機檔案）。');const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false},video:false});try{const c=new (window.AudioContext||window.webkitAudioContext)(),f=c.createBiquadFilter(),a=c.createAnalyser(),src=c.createMediaStreamSource(s);f.type='highpass';f.frequency.value=150;a.fftSize=512;a.smoothingTimeConstant=.5;src.connect(f);f.connect(a);await c.resume();stream=s;context=c;filter=f;analyser=a;source=src;s.getAudioTracks()[0].onended=()=>{if(state==='running'||state==='paused'){reset();els.help.textContent='麥克風已中斷，請檢查連接後再開始。'}}}catch(e){s.getTracks().forEach(t=>t.stop());throw e}}async function sound(kind){if(!els.soundOn.checked)return false;try{let c=context;if(!c||c.state==='closed'){c=new (window.AudioContext||window.webkitAudioContext)();context=c}await c.resume();const t=c.currentTime+.02;const notes=kind==='win'?[523,659,784,1047]:[180,120,75];for(const [i,f] of notes.entries()){const o=c.createOscillator(),g=c.createGain();o.type=kind==='win'?'triangle':'sawtooth';o.frequency.setValueAtTime(f,t+i*.2);g.gain.setValueAtTime(.0001,t+i*.2);g.gain.exponentialRampToValueAtTime(Math.max(.0001,.55*Number(els.volume.value)/100),t+i*.2+.04);g.gain.exponentialRampToValueAtTime(.0001,t+i*.2+.3);o.connect(g).connect(c.destination);o.start(t+i*.2);o.stop(t+i*.2+.31)}return true}catch(e){els.help.textContent='音效未能播放，請檢查電腦音量或按「試聽音效」。';return false}}els.testSound.onclick=async()=>{if(!els.soundOn.checked){els.help.textContent='請先勾選「播放結束音效」，再按試聽。';return}const ok=await sound('win');if(ok)els.help.textContent='已播放試聽音效；若未聽到，請檢查電腦或電子白板的輸出音量。'};function finish(kind){if(state!=='running')return;state=kind;cancelAnimationFrame(raf);controls();els.arena.classList.remove('paused');document.body.classList.remove('win','lose');document.body.classList.add(kind==='win'?'win':'lose');if(kind==='win'){remaining=0;setStage('win','🎉 挑戰成功！哥吉拉安心睡著了');sound('win');const oldContext=context;setTimeout(()=>{if(context===oldContext)closeMic()},1600)}else{hp=0;setStage(5,'💥 哥吉拉噴出原子吐息！挑戰結束');els.dino.classList.add('burst');sound('lose');const oldContext=context;setTimeout(()=>{if(context===oldContext)closeMic()},1600);finishTimer=setTimeout(()=>{els.dino.classList.remove('burst');els.status.textContent='挑戰結束｜按「重置」可再試一次'},Number(els.burstDuration.value)*1000)}paint()}const buffer=new Uint8Array(256);function tick(now){if(state!=='running')return;const dt=Math.min((now-lastFrame)/1000,.25);lastFrame=now;remaining=Math.max(0,(deadline-now)/1000);if(remaining<=0){finish('win');return}analyser.getByteFrequencyData(buffer);let sum=0;for(const v of buffer)sum+=v;const raw=Math.min(100,sum/buffer.length/128*100*sens[Number(els.sensitivity.value)-1]);smoothed+=(raw-smoothed)*Math.min(1,dt*8);const loud=smoothed>Number(els.threshold.value);if(loud){loudFor+=dt;calmFor=0}else{calmFor+=dt;loudFor=Math.max(0,loudFor-dt*1.4)}if(loudFor>.5)hp=Math.max(0,hp-13.2*dt);else if(els.recovery.checked&&calmFor>2)hp=Math.min(100,hp+2*dt);if(hp<=0){finish('lose');return}let next=stage;if(loudFor>1.4)next=4;else if(loudFor>.9)next=3;else if(loudFor>.3)next=2;else if(calmFor>.7)next=1;const messages={1:'💤 哥吉拉安穩熟睡中',2:'👀 哥吉拉微微睜眼',3:'😳 哥吉拉驚醒了',4:'😤 哥吉拉快忍不住了'};if(next!==stage)setStage(next,messages[next]);paint();raf=requestAnimationFrame(tick)}els.start.onclick=async()=>{if(state!=='idle')return;els.start.disabled=true;els.help.textContent='正在取得麥克風權限…';try{await openMic();remaining=duration();hp=100;smoothed=loudFor=calmFor=0;setStage(1,'💤 哥吉拉安穩熟睡中');state='running';controls();paint();els.help.textContent='挑戰進行中。老師需要說話時，可以先按「暫停」。';lastFrame=performance.now();deadline=lastFrame+remaining*1000;raf=requestAnimationFrame(tick)}catch(e){closeMic();state='idle';controls();els.help.textContent='無法啟用麥克風：'+(e?.message||'請檢查權限與連線。')}};els.pause.onclick=()=>{if(state==='running'){state='paused';cancelAnimationFrame(raf);els.arena.classList.add('paused');setStage(stage,'Ⅱ 已暫停｜倒數與扣血停止');els.help.textContent='已暫停。按「繼續」恢復挑戰。'}else if(state==='paused'){state='running';els.arena.classList.remove('paused');const msg={1:'💤 哥吉拉安穩熟睡中',2:'👀 哥吉拉微微睜眼',3:'😳 哥吉拉驚醒了',4:'😤 哥吉拉快忍不住了'};setStage(stage,msg[stage]);lastFrame=performance.now();deadline=lastFrame+remaining*1000;raf=requestAnimationFrame(tick)}controls()};function reset(){clearTimeout(finishTimer);cancelAnimationFrame(raf);closeMic();state='idle';remaining=duration();hp=100;smoothed=loudFor=calmFor=0;stage=0;setStage(1,'💤 哥吉拉安穩熟睡中');els.dino.classList.remove('burst');els.arena.classList.remove('paused');document.body.classList.remove('win','lose');els.help.textContent='首次開始時，請允許瀏覽器使用麥克風。暫停會同時停止倒數及扣血。';controls();paint()}els.reset.onclick=reset;els.calibrate.onclick=async()=>{if(state!=='idle')return;state='calibrating';controls();els.help.textContent='校準中：請讓教室維持平常的活動音量，約 5 秒。';try{await openMic();let samples=[];const started=performance.now(),arr=new Uint8Array(analyser.frequencyBinCount);await new Promise(resolve=>{const sample=()=>{if(state!=='calibrating'||performance.now()-started>=5000){resolve();return}analyser.getByteFrequencyData(arr);let avg=0;for(const v of arr)avg+=v;const value=Math.min(100,avg/arr.length/128*100*sens[Number(els.sensitivity.value)-1]);samples.push(value);els.meterFill.style.width=Math.round(value)+'%';els.level.textContent=Math.round(value)+'%';setTimeout(sample,100)};sample()});samples.sort((a,b)=>a-b);const measured=samples[Math.floor(samples.length*.8)]||0;const suggestion=Math.max(20,Math.min(95,Math.round(measured+15)));els.threshold.value=suggestion;updateThreshold();els.help.textContent=`校準完成：常態音量約 ${Math.round(measured)}%，建議紅線 ${suggestion}%。請再用實際上課聲量觀察並微調。`}catch(e){els.help.textContent='校準失敗：'+(e?.message||'請檢查麥克風權限')}finally{closeMic();state='idle';controls();els.meterFill.style.width='0%';els.level.textContent='0%'}};document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||!['running','paused'].includes(state))return;if(['INPUT','BUTTON','SUMMARY','TEXTAREA'].includes(document.activeElement?.tagName))return;e.preventDefault();els.pause.click()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')els.pause.click()});window.addEventListener('pagehide',closeMic);paint();controls()})();
</script></body></html>
